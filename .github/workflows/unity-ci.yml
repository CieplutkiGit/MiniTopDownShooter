name: Unity CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Asset Store preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release preflight
        run: python3 .github/scripts/release_preflight.py

  test:
    name: EditMode + PlayMode tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      unity_available: ${{ steps.license.outputs.available }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Unity license configuration
        id: license
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity personal/manual license secret detected."
          elif [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity serial license credentials detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license secrets are not fully configured. Static Asset Store preflight ran, but Unity tests and the player build are skipped."
          fi

      - name: Cache Unity Library
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run Unity tests
        if: steps.license.outputs.available == 'true'
        id: unityTests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: ${{ always() && steps.license.outputs.available == 'true' && steps.unityTests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: ${{ steps.unityTests.outputs.artifactsPath }}
          if-no-files-found: warn

  build:
    name: Linux player smoke build
    needs:
      - preflight
      - test
    if: needs.test.outputs.unity_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-build-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: Build Linux player
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneLinux64
          buildsPath: build

      - name: Upload smoke build
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-build
          path: build
          if-no-files-found: error
