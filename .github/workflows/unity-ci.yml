name: Unity CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity license secrets
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" ]]; then
            echo "Unity personal license (UNITY_LICENSE) is configured."
            exit 0
          fi

          missing=()
          if [[ -z "$UNITY_SERIAL" ]]; then
            missing+=("UNITY_SERIAL")
          fi
          if [[ -z "$UNITY_EMAIL" ]]; then
            missing+=("UNITY_EMAIL")
          fi
          if [[ -z "$UNITY_PASSWORD" ]]; then
            missing+=("UNITY_PASSWORD")
          fi

          if [[ ${#missing[@]} -eq 3 ]]; then
            echo "::error title=Validation Blocked::Unity license secrets are not configured. To run Unity CI, configure either UNITY_LICENSE (personal license) or UNITY_SERIAL, UNITY_EMAIL, and UNITY_PASSWORD (professional license). Missing secrets: UNITY_LICENSE, ${missing[*]}."
            exit 1
          elif [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Validation Blocked::Incomplete Unity professional license credentials. Missing secrets: ${missing[*]}."
            exit 1
          fi
          echo "Unity professional license credentials are configured."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run Unity tests
        id: unityTests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: ${{ always() && steps.unityTests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: ${{ steps.unityTests.outputs.artifactsPath }}
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
          - StandaloneWindows64
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity license secrets
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" ]]; then
            echo "Unity personal license (UNITY_LICENSE) is configured."
            exit 0
          fi

          missing=()
          if [[ -z "$UNITY_SERIAL" ]]; then
            missing+=("UNITY_SERIAL")
          fi
          if [[ -z "$UNITY_EMAIL" ]]; then
            missing+=("UNITY_EMAIL")
          fi
          if [[ -z "$UNITY_PASSWORD" ]]; then
            missing+=("UNITY_PASSWORD")
          fi

          if [[ ${#missing[@]} -eq 3 ]]; then
            echo "::error title=Validation Blocked::Unity license secrets are not configured. To run Unity CI, configure either UNITY_LICENSE (personal license) or UNITY_SERIAL, UNITY_EMAIL, and UNITY_PASSWORD (professional license). Missing secrets: UNITY_LICENSE, ${missing[*]}."
            exit 1
          elif [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Validation Blocked::Incomplete Unity professional license credentials. Missing secrets: ${missing[*]}."
            exit 1
          fi
          echo "Unity professional license credentials are configured."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-
            Library-${{ runner.os }}-

      - name: Build player
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build/${{ matrix.targetPlatform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error
